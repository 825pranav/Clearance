# Paste into https://api.slack.com/apps -> Create New App -> From an app manifest.
display_information:
  name: Clearance
  description: Files access requests as GitLab issues and routes them to approvers. Never grants access itself.
  background_color: "#2f3b52"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: clearance
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read   # receive @Clearance mentions
      - chat:write          # reply in threads and DM status changes
      - im:history          # read direct messages sent to the bot
      - im:read
      - im:write            # open a DM to notify a requester
      - users:read          # look up the user who wrote
      - users:read.email    # map the Slack user to an employee by email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false

[uwsgi]
# Which Python object to run: the `application` in web/wsgi.py.
module = web.wsgi:application

# Speak the binary uwsgi protocol to Nginx. Port 8000 is only open inside the Docker network.
socket = :8000

# A master process watches the workers and replaces any that die.
master = true
# Two workers suit a small admin site: nearly all the time goes to Postgres, and a worker costs memory.
processes = 2

# Stop on SIGTERM. By default uWSGI reloads on it, so `docker stop` would hang until it was killed.
die-on-term = true
# Exit if the app fails to load, instead of running with nothing to serve.
need-app = true
# Treat an unknown option here as an error, so a typo cannot quietly switch something off.
strict = true

# Kill a worker stuck on one request for 30 seconds, so a slow query cannot use up every worker.
harakiri = 30
# Replace each worker after 1000 requests, which limits any slow memory leak.
max-requests = 1000
# Admin filter URLs can be long, and the default 4 KB would reject them.
buffer-size = 16384

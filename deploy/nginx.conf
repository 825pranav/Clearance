# Send everything on plain HTTP to HTTPS, because the console's login cookies are HTTPS-only.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Mounted from deploy/certs. `make console-cert` makes a self-signed pair for local use.
    ssl_certificate     /etc/nginx/certs/console.crt;
    ssl_certificate_key /etc/nginx/certs/console.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Don't show the Nginx version on error pages.
    server_tokens off;
    # Largest request body. The console only has small forms, so anything bigger is refused early.
    client_max_body_size 1m;

    # Nginx sends these files itself, so they never use up a uWSGI worker.
    location /static/ {
        alias /srv/static/;
        expires 7d;
        access_log off;
    }

    location / {
        include uwsgi_params;
        # `console` is the service name in docker-compose.yml. Using a variable makes Nginx look the name up per
        # request through Docker's DNS. A fixed name is looked up once at startup, so Nginx would crash if it
        # started first and would keep a stale address after the console restarted.
        resolver 127.0.0.11 valid=10s;
        set $console_upstream console:8000;
        uwsgi_pass $console_upstream;
        # Tell Django the visitor used HTTPS. This always overwrites what the visitor sent, which is what makes
        # SECURE_PROXY_SSL_HEADER in settings.py safe to trust.
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        # Slightly longer than uWSGI's 30 second harakiri, so uWSGI gives up first.
        uwsgi_read_timeout 35s;
    }
}

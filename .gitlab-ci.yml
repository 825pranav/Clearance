stages:
  - test
  - eval

variables:
  POSTGRES_DB: clearance
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clearance
  GITLAB_DRY_RUN: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/

.python:
  image: python:3.12-slim
  services:
    - postgres:16-alpine
  before_script:
    - pip install -r requirements.txt
    - python -m app.db seed
    - python -m app.retrieval build

unit-tests:
  extends: .python
  stage: test
  script:
    - python -m pytest -q

# Needs an LLM: set LLM_BASE_URL, LLM_API_KEY and LLM_MODEL as masked CI/CD variables first.
evals:
  extends: .python
  stage: eval
  when: manual
  script:
    - python evals/run_evals.py
    - python evals/run_evals.py --adversarial
  artifacts:
    paths:
      - evals/results.json
      - evals/results.md

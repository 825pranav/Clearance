# Main eval suite: 30 conversations. Written before the agent existed and frozen afterwards.
# Any later change to a case is recorded in DECISIONS.md with the reason.
#
# Fields
#   employee        session identity (from data/seed.sql)
#   setup           requests that already exist for this employee before the conversation
#   turns           user messages, sent one at a time
#   expect.outcome  outcome after the last turn
#   expect.turn_outcomes  outcome after each turn (multi-turn cases)
#   expect.system / access_level / risk / approvers  the request row that must exist (filed cases)
#   expect.cites    policy questions: the reply must name one of these handbook files

